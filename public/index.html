<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f1a" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>unaity</title>
  <style>
    :root {
      --bg: #0b0f1a;
      --panel: #121829;
      --panel-2: #1a2338;
      --text: #e8ecf6;
      --muted: #8a94ad;
      --accent: #7c5cff;
      --accent-2: #2563eb;
      --user: #2a3550;
      --border: #263149;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .logo {
      width: 30px; height: 30px; border-radius: 8px; flex: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid; place-items: center; font-weight: 800; color: #fff;
    }
    header h1 { font-size: 17px; margin: 0; flex: 1; font-weight: 700; }
    select {
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 7px 8px; font-size: 13px; max-width: 45vw;
    }
    #chat {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 14px;
      -webkit-overflow-scrolling: touch;
    }
    .msg { max-width: 88%; padding: 11px 14px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
    .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg.error { align-self: flex-start; background: #3a1620; border: 1px solid #6d2436; color: #ffb4c0; }
    .via { display: block; margin-top: 6px; font-size: 11px; color: var(--muted); }
    .empty { margin: auto; text-align: center; color: var(--muted); max-width: 320px; }
    .empty .big { font-size: 40px; margin-bottom: 8px; }
    form {
      display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: var(--panel); border-top: 1px solid var(--border);
    }
    textarea {
      flex: 1; resize: none; background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 14px; padding: 11px 14px;
      font: inherit; max-height: 140px;
    }
    button.send {
      flex: none; width: 46px; border: 0; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; font-size: 20px; cursor: pointer;
    }
    button.send:disabled { opacity: .5; }
    .dots span { animation: blink 1.2s infinite both; }
    .dots span:nth-child(2){ animation-delay: .2s } .dots span:nth-child(3){ animation-delay: .4s }
    @keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }
  </style>
</head>
<body>
  <header>
    <div class="logo">U</div>
    <h1>unaity</h1>
    <select id="provider" title="Which brain answers">
      <option value="">Auto (fallback)</option>
    </select>
  </header>

  <div id="chat">
    <div class="empty" id="empty">
      <div class="big">🧠</div>
      <div><strong>One brain, many AIs.</strong></div>
      <div>Ask anything. unaity routes it to a free provider and falls back automatically if one is busy.</div>
    </div>
  </div>

  <form id="form">
    <textarea id="input" rows="1" placeholder="Message unaity…" autocomplete="off"></textarea>
    <button class="send" id="send" type="submit" aria-label="Send">➤</button>
  </form>

  <script src="./app.js"></script>
</body>
</html>

name: Deploy static app to GitHub Pages

# Publishes the backend-free client in static/ to GitHub Pages. After the first
# successful run you get a permanent URL like https://<user>.github.io/unaity/
# that works on any phone or laptop — no server, no cost.
#
# One-time setup (from phone or laptop): repo Settings -> Pages ->
# "Build and deployment" -> Source: GitHub Actions. Then this runs on push.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on automatically the first time, so no manual
          # Settings toggle is needed (requires the pages: write permission
          # declared above).
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static
      - id: deployment
        uses: actions/deploy-pages@v4
